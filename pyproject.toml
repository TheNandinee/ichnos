[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ichnos"
version = "0.1.0"
description = "Open, replayable GNSS jamming and spoofing intelligence from public ADS-B data"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
